<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03070F">
<title>JARVIS Voice Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 마이크 전용 페이지: 말을 받아 적어 claude.ai 자비스로 넘긴다. 단일 다크 홀로그램 테마. */
:root {
  color-scheme: dark;
  --bg: #03070F; --cyan: #00E5FF; --cyan-white: #B8F6FF; --amber: #FFB300; --red: #FF3D57; --dim: #5E8A99;
  --f-display: "Orbitron", ui-monospace, monospace;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(circle at 50% 42%, rgba(0,229,255,.12), transparent 60%), var(--bg);
  color: var(--cyan-white); font-family: var(--f-body);
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  -webkit-tap-highlight-color: transparent;
}
.label { font-family: var(--f-display); font-size: 10px; letter-spacing: .24em; color: var(--cyan); text-shadow: 0 0 8px rgba(0,229,255,.6); }
.label.dim { color: var(--dim); text-shadow: none; }
header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; }
header b { font-family: var(--f-display); letter-spacing: .24em; font-size: 12px; }
#core {
  position: relative; width: min(72vw, 300px); aspect-ratio: 1; border-radius: 50%;
  border: 0; background: none; cursor: pointer; margin-top: 4vh; touch-action: manipulation;
}
#core:focus-visible { outline: 2px solid var(--cyan); outline-offset: 8px; }
.ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(0,229,255,.55); }
.ring.r1 { border-style: dashed; animation: spin 18s linear infinite; }
.ring.r2 { inset: 9%; border-width: 5px; border-color: rgba(0,229,255,.9) transparent rgba(0,229,255,.9) transparent; animation: spin 7s linear infinite reverse; filter: drop-shadow(0 0 6px var(--cyan)); }
.ring.r3 { inset: 22%; border-color: rgba(184,246,255,.5); border-width: 1px; }
.ring.r4 { inset: 28%; border-width: 3px; border-color: var(--cyan); box-shadow: 0 0 18px rgba(0,229,255,.6); animation: spin 4s linear infinite; border-right-color: transparent; }
.glow { position: absolute; inset: 33%; border-radius: 50%; background: radial-gradient(circle, #fff 0, var(--cyan-white) 30%, rgba(0,229,255,.8) 60%, transparent 72%); animation: breathe 2.4s ease-in-out infinite; }
#core.on .ring.r1 { animation-duration: 4s; }
#core.on .ring.r2 { animation-duration: 1.6s; }
#core.on .glow { animation: breathe .45s ease-in-out infinite; }
#core.err .ring { border-color: var(--red) !important; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: scale(1.12); opacity: .85; } }
#state { font-family: var(--f-display); font-size: 12px; letter-spacing: .3em; color: var(--cyan); min-height: 16px; }
#heard { width: 100%; max-width: 480px; min-height: 64px; text-align: center; font-size: 20px; line-height: 1.5; font-weight: 500; word-break: keep-all; text-shadow: 0 0 10px rgba(0,229,255,.4); }
#help { width: 100%; max-width: 480px; font-size: 13px; line-height: 1.7; color: var(--dim); text-align: center; }
form { width: 100%; max-width: 480px; display: flex; gap: 8px; margin-top: auto; }
input { flex: 1; min-width: 0; background: rgba(0,229,255,.06); border: 0; border-bottom: 1.5px solid var(--cyan); color: var(--cyan-white); font: 500 16px var(--f-body); padding: 11px 12px; outline: none; }
button.send { font-family: var(--f-display); font-weight: 700; font-size: 11px; letter-spacing: .2em; color: var(--cyan); background: rgba(0,229,255,.08); border: 1px solid var(--cyan); padding: 0 14px; min-height: 44px; cursor: pointer; }
a { color: var(--cyan); }
@media (prefers-reduced-motion: reduce) { .ring, .glow { animation: none !important; } }
</style>
</head>
<body>
<header><b>J.A.R.V.I.S.</b><span class="label">VOICE LINK</span></header>

<button id="core" type="button" aria-label="탭해서 말하기">
  <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="ring r4"></span><span class="glow"></span>
</button>
<div id="state">TAP TO SPEAK</div>
<div id="heard" aria-live="polite"></div>
<p id="help">코어를 탭하고 말하세요. 말이 끝나면 claude.ai 자비스로 넘어가 대답합니다.<br>대답을 들은 뒤 <b>뒤로가기</b>를 누르면 여기로 돌아와 다시 말할 수 있어요.</p>

<form id="form" autocomplete="off">
  <input id="q" type="text" placeholder="또는 여기에 입력" enterkeyhint="send" aria-label="명령 입력">
  <button class="send" type="submit">SEND</button>
</form>

<script>
(() => {
  "use strict";
  // claude.ai 에 올린 자비스 주소 (API 키 없이 Claude 사용)
  const JARVIS_URL = "https://claude.ai/artifact/BNTpUXaAQNXoNMpNpSyTfV";
  const $ = (id) => document.getElementById(id);
  const core = $("core"), st = $("state"), heard = $("heard");

  function toB64Url(text) {
    const bytes = new TextEncoder().encode(text);
    let bin = "";
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function handoff(text) {
    const t = text.trim().slice(0, 400);
    if (!t) return;
    st.textContent = "TRANSMITTING";
    heard.textContent = t;
    const id = Date.now().toString(36);
    // 같은 탭에서 이동: 대답을 들은 뒤 뒤로가기로 돌아올 수 있다
    setTimeout(() => { location.href = `${JARVIS_URL}#q.${id}.${toB64Url(t)}`; }, 350);
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, listening = false;

  function beep() {
    try {
      const a = new (window.AudioContext || window.webkitAudioContext)();
      [1318, 1975].forEach((f, i) => {
        const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + i * 0.09;
        o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
        o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.14);
      });
    } catch (e) {}
  }

  function fail(msg) {
    listening = false;
    core.classList.remove("on"); core.classList.add("err");
    st.textContent = "MIC FAULT";
    heard.textContent = msg;
    setTimeout(() => { core.classList.remove("err"); st.textContent = "TAP TO SPEAK"; }, 2200);
  }

  function listen() {
    if (!SR) { fail("이 브라우저는 음성 인식을 지원하지 않아요. 크롬으로 열어 주세요."); return; }
    if (listening) { try { rec.stop(); } catch (e) {} return; }
    rec = new SR();
    rec.lang = "ko-KR"; rec.interimResults = true; rec.maxAlternatives = 1;
    let finalText = "";
    rec.onstart = () => { listening = true; core.classList.add("on"); st.textContent = "LISTENING"; heard.textContent = ""; beep(); };
    rec.onresult = (e) => {
      let s = "";
      for (const r of e.results) s += r[0].transcript;
      finalText = s; heard.textContent = s;
    };
    rec.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") fail("마이크 권한이 꺼져 있어요. 주소창 왼쪽 아이콘 → 권한 → 마이크를 허용해 주세요.");
      else if (e.error === "no-speech") fail("말소리가 들리지 않았어요. 다시 탭해 주세요.");
      else if (e.error !== "aborted") fail("음성 인식 오류: " + e.error);
    };
    rec.onend = () => {
      listening = false; core.classList.remove("on");
      if (finalText.trim()) handoff(finalText);
      else if (st.textContent === "LISTENING") st.textContent = "TAP TO SPEAK";
    };
    try { rec.start(); } catch (e) { fail("음성 인식을 시작하지 못했어요."); }
  }

  core.addEventListener("click", listen);
  $("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("q").value; $("q").value = ""; handoff(v); });
  // 뒤로가기로 돌아왔을 때 상태 초기화
  addEventListener("pageshow", () => { st.textContent = "TAP TO SPEAK"; core.classList.remove("on", "err"); });
})();
</script>
</body>
</html>
